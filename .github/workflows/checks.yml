name: SDK starter checks
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aidflow_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: aidflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://aidflow_test:disposable_ci_password@127.0.0.1:5432/aidflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          PAIFLOW_API_TOKEN: pfd_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PAIFLOW_DEPLOYMENT_ID: 12345678-1234-1234-1234-123456789abc
      - name: Check browser credential isolation
        run: node scripts/check-browser-bundle.mjs
